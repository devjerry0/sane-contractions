name: Bug report
description: Something expands wrong, or doesn't expand at all
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: sane-contractions version
      description: 'Output of `python -c "import contractions; print(contractions.__version__)"`'
      placeholder: "0.3.2"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code
      description: The smallest snippet that shows the problem, including any flags you pass.
      render: python
      placeholder: |
        import contractions
        contractions.expand("...")
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What you got
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
