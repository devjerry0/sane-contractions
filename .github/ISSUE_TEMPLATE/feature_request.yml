name: Feature request
description: Suggest a new contraction, slang term, or feature
labels: ["enhancement"]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: For new contractions or slang, list each term with its expansion.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Where did you run into this?
      description: An example of the text you're processing helps, especially for slang that could also be an ordinary word.
